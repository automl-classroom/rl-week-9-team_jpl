defaults:
  - override hydra/launcher: joblib


env:
  name: CartPole-v1

agent:
  # Base PPO hyperparameters
  lr_actor: 0.000575
  lr_critic: 1.8348e-06
  gamma: 0.9824
  gae_lambda: 0.90
  clip_eps: 0.2421
  epochs: 10
  batch_size: 126
  ent_coef: 0.0107
  vf_coef: 0.97867
  hidden_size: 79

  # Dyna-PPO HPs
  use_model: ???         # Enable model-based updates
  model_lr: 0.0007796            # Learning rate for the model
  model_epochs: 10           # Number of epochs of model training
  model_batch_size: 259     # Batch size for model training
  imag_horizon: 6           # Horizon for imagined trajectories
  imag_batches: 12          # Number of batches for imagined updates
  max_buffer_size: 8392    # Size of the replay buffer for imagined experiences

train:
  total_steps: 40000        # Total training steps
  eval_interval: 500       # More frequent evaluation to track progress
  eval_episodes: 10         # More episodes for better evaluation statistics




